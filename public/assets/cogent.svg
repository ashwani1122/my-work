<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Cascadia Code','Consolas','Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e0b22"/>
      <stop offset="1" stop-color="#150718"/>
    </linearGradient>
    <pattern id="stripes" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#ff8a3d"/>
      <rect width="3" height="9" fill="#e2681f"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#2c1332" stroke-width="1"/>

  <!-- shell command -->
  <text x="64" y="126" font-size="25" fill="#cbb6dc">PS C:\Users\ashwa\claude&gt;<tspan fill="#ff9a4d"> npm run dev</tspan></text>
  <text x="64" y="168" font-size="25" fill="#9a83ad">&gt; <tspan fill="#d9c9e6">cogent@0.1.0</tspan> dev</text>
  <text x="64" y="210" font-size="25" fill="#9a83ad">&gt; <tspan fill="#cbb6dc">tsx --env-file-if-exists=.env src/index.ts</tspan></text>

  <!-- logo -->
  <text x="60" y="404" font-size="132" font-weight="700" letter-spacing="10" fill="#7a2f12">COGENT</text>
  <text x="56" y="396" font-size="132" font-weight="700" letter-spacing="10" fill="url(#stripes)">COGENT</text>

  <!-- model + help -->
  <text x="64" y="500" font-size="26" fill="#9a83ad"><tspan fill="#e6d6f2">groq/openai/gpt-oss-120b</tspan>  &#183;  session <tspan fill="#cbb6dc">d04e8a62</tspan></text>
  <text x="64" y="540" font-size="26" fill="#8d76a1">/help for commands  &#183;  /exit to quit</text>

  <!-- prompt box -->
  <rect x="60" y="590" width="1480" height="104" rx="10" fill="#ff8a3d" fill-opacity="0.04" stroke="#ff8a3d" stroke-width="2.5"/>
  <text x="92" y="656" font-size="30" fill="#ff8a3d">&gt;</text>
  <rect x="126" y="630" width="15" height="32" fill="#ff8a3d">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- status -->
  <text x="64" y="756" font-size="25" fill="#a58cb8">groq/openai/gpt-oss-120b  &#183;  context <tspan fill="#e6d6f2">0%</tspan>  &#183;  /help for commands</text>

  <!-- subtle bottom fade -->
  <rect x="0" y="820" width="1600" height="80" fill="#0f0412" fill-opacity="0.35"/>
</svg>
